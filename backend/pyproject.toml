[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmind"
version = "0.1.0"
description = "Self-hosted workflow automation and multi-agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "greenlet>=3.0.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "PyJWT>=2.9.0",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "celery[redis]>=5.4.0",
  "redis>=5.0.0",
  "jinja2>=3.1.4",
  "jmespath>=1.0.1",
  "tiktoken>=0.7.0",
  "pypdf>=4.3.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "minio>=7.2.8",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "cryptography>=43.0.0",
  "aiosmtplib>=3.0.0",
  "pgvector>=0.3.0",
  "croniter>=2.0.7",
  "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]



